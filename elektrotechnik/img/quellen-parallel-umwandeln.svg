<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 670" font-family="Helvetica, Arial, sans-serif">
  <!-- ===== 1: zwei reale Spannungsquellen parallel ===== -->
  <g stroke="#111827" stroke-width="2.5" fill="none">
    <line x1="90" y1="30" x2="414" y2="30"/>
    <line x1="90" y1="190" x2="414" y2="190"/>
    <line x1="90" y1="30" x2="90" y2="50"/>
    <rect x="78" y="50" width="24" height="50" fill="#fff"/>
