  <circle cx="140" cy="265" r="5" fill="#111827"/>
  <circle cx="140" cy="405" r="5" fill="#111827"/>
  <circle cx="250" cy="265" r="5" fill="#111827"/>
  <circle cx="250" cy="405" r="5" fill="#111827"/>
  <circle cx="330" cy="265" r="5" fill="#111827"/>
  <circle cx="330" cy="405" r="5" fill="#111827"/>
  <circle cx="420" cy="265" r="6" fill="#fff" stroke="#111827" stroke-width="2.5"/>
  <circle cx="420" cy="405" r="6" fill="#fff" stroke="#111827" stroke-width="2.5"/>
  <polygon points="98,312 93,325 103,325" fill="#ef4444"/>
  <line x1="98" y1="324" x2="98" y2="355" stroke="#ef4444" stroke-width="2.5"/>
  <polygon points="288,312 283,325 293,325" fill="#ef4444"/>
  <line x1="288" y1="324" x2="288" y2="355" stroke="#ef4444" stroke-width="2.5"/>
  <text x="30" y="442" fill="#ef4444" font-size="28" font-style="italic">I<tspan font-size="20" dy="6">k,1</tspan></text>
  <text x="222" y="442" fill="#ef4444" font-size="28" font-style="italic">I<tspan font-size="20" dy="6">k,2</tspan></text>
  <text x="158" y="342" fill="#111827" font-size="28" font-style="italic">R<tspan font-size="20" dy="6">i,1</tspan></text>
  <text x="348" y="342" fill="#111827" font-size="28" font-style="italic">R<tspan font-size="20" dy="6">i,2</tspan></text>

  <text x="235" y="488" fill="#111827" font-size="36" text-anchor="middle">≙</text>

  <!-- ===== 3: Ersatzstromquelle ===== -->
  <g stroke="#111827" stroke-width="2.5" fill="none">
    <line x1="140" y1="515" x2="414" y2="515"/>
    <line x1="140" y1="655" x2="414" y2="655"/>
    <line x1="140" y1="515" x2="140" y2="655"/>
    <circle cx="140" cy="585" r="22" fill="#fff"/>
    <line x1="118" y1="585" x2="162" y2="585"/>
    <line x1="250" y1="515" x2="250" y2="655"/>
    <rect x="238" y="555" width="24" height="60" fill="#fff"/>
  </g>
  <circle cx="250" cy="515" r="5" fill="#111827"/>
  <circle cx="250" cy="655" r="5" fill="#111827"/>
  <circle cx="420" cy="515" r="6" fill="#fff" stroke="#111827" stroke-width="2.5"/>
  <circle cx="420" cy="655" r="6" fill="#fff" stroke="#111827" stroke-width="2.5"/>
  <polygon points="104,562 99,575 109,575" fill="#ef4444"/>
  <line x1="104" y1="574" x2="104" y2="605" stroke="#ef4444" stroke-width="2.5"/>
  <text x="92" y="596" fill="#ef4444" font-size="28" font-style="italic" text-anchor="end">I<tspan font-size="20" dy="6">k,ges</tspan></text>
  <text x="268" y="592" fill="#111827" font-size="28" font-style="italic">R<tspan font-size="20" dy="6">i,ges</tspan></text>
</svg>
