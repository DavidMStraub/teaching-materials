<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 30 500 290" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="laF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="laD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="laM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b91c1c" stroke-width="2.5"/>
    </pattern>
  </defs>

  <!-- Eisen links -->
  <rect x="60" y="90" width="130" height="140" fill="#9ca3af"/>
  <!-- Eisen rechts (verschiebbar) -->
  <rect x="290" y="90" width="130" height="140" fill="#9ca3af"/>

  <!-- neues Feldvolumen A·dl -->
  <rect x="262" y="90" width="28" height="140" fill="url(#hatch)" stroke="#b91c1c" stroke-width="2"/>

  <!-- Luftspalt-Bemaßung -->
  <line x1="190" y1="258" x2="262" y2="258" stroke="#4b5563" stroke-width="2" marker-start="url(#laD)" marker-end="url(#laD)"/>
  <text x="222" y="280" fill="#4b5563" font-size="21" font-style="italic" text-anchor="middle">&#948;</text>

  <line x1="262" y1="66" x2="290" y2="66" stroke="#b91c1c" stroke-width="2" marker-start="url(#laD)" marker-end="url(#laD)"/>
  <text x="276" y="56" fill="#b91c1c" font-size="20" font-style="italic" text-anchor="middle">d&#8467;</text>

  <!-- Verschiebung -->
  <line x1="440" y1="160" x2="482" y2="160" stroke="#b91c1c" stroke-width="3.5" marker-end="url(#laM)"/>

  <!-- Kräfte: Anziehung -->
  <line x1="150" y1="160" x2="182" y2="160" stroke="#111827" stroke-width="4" marker-end="url(#laF)"/>
  <line x1="330" y1="160" x2="298" y2="160" stroke="#111827" stroke-width="4" marker-end="url(#laF)"/>
  <text x="128" y="152" fill="#111827" font-size="21" font-style="italic">F</text>
  <text x="342" y="152" fill="#111827" font-size="21" font-style="italic">F</text>

  <!-- Polflaeche -->
  <text x="112" y="118" fill="#111827" font-size="20" font-style="italic">A</text>

  <text x="60" y="308" fill="#6b7280" font-size="17">Spalt um <tspan font-style="italic">d&#8467;</tspan> vergrößern → neues Feldvolumen <tspan font-style="italic">A·d&#8467;</tspan> (rot)</text>
</svg>
