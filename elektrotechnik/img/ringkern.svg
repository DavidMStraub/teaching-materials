<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" font-family="Helvetica, Arial, sans-serif">
  <!-- Ringkern (Draufsicht) -->
  <circle cx="220" cy="200" r="160" fill="#e5e7eb" stroke="#111827" stroke-width="2.5"/>
  <circle cx="220" cy="200" r="100" fill="#fff" stroke="#111827" stroke-width="2.5"/>
  <!-- mittlere Feldlinie -->
  <circle cx="220" cy="200" r="130" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="220" y="62" fill="#2563eb" font-size="28" font-style="italic" text-anchor="middle">ℓ</text>
  <!-- Wicklung auf der linken Seite -->
  <g stroke="#b45309" stroke-width="4">
    <line x1="52" y1="160" x2="128" y2="172"/>
    <line x1="50" y1="180" x2="125" y2="186"/>
    <line x1="50" y1="200" x2="124" y2="200"/>
    <line x1="50" y1="220" x2="125" y2="214"/>
    <line x1="52" y1="240" x2="128" y2="228"/>
  </g>
  <!-- Anschlüsse -->
  <line x1="52" y1="160" x2="20" y2="130" stroke="#b45309" stroke-width="3"/>
  <line x1="52" y1="240" x2="20" y2="270" stroke="#b45309" stroke-width="3"/>
  <polygon points="16,126 30,132 24,140" fill="#ef4444"/>
  <text x="22" y="112" fill="#ef4444" font-size="28" font-style="italic">I</text>
  <text x="220" y="210" fill="#b45309" font-size="28" text-anchor="middle"><tspan font-style="italic">N</tspan> Windungen</text>
</svg>
