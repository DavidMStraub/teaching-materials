<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>

  <!-- Achsen -->
  <line x1="60" y1="320" x2="390" y2="320" stroke="#111827" stroke-width="2.5" marker-end="url(#aK)"/>
  <line x1="60" y1="320" x2="60" y2="30" stroke="#111827" stroke-width="2.5" marker-end="url(#aK)"/>
  <text x="392" y="348" fill="#111827" font-size="24" font-style="italic">U</text>
  <text x="28" y="45" fill="#111827" font-size="24" font-style="italic">I</text>

  <!-- linearer Leiter: Gerade durch den Ursprung -->
  <line x1="60" y1="320" x2="350" y2="60" stroke="#2563eb" stroke-width="4"/>
  <text x="248" y="110" fill="#2563eb" font-size="20" text-anchor="end">Metall, konstante <tspan font-style="italic">T</tspan></text>
  <text x="248" y="134" fill="#2563eb" font-size="20" text-anchor="end">Steigung 1/<tspan font-style="italic">R</tspan></text>

  <!-- Glühlampe: Faden wird heiß, R steigt, Kurve flacht ab -->
  <path d="M 60,320 C 130,257 220,215 360,190" fill="none" stroke="#ef4444" stroke-width="4"/>
  <text x="360" y="240" fill="#ef4444" font-size="20" text-anchor="end">Glühlampe</text>
</svg>
