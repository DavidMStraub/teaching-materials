<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" font-family="Helvetica, Arial, sans-serif">
  <!-- ===== links: Reihenschaltung ===== -->
  <g stroke="#111827" stroke-width="2.5" fill="none">
    <circle cx="25" cy="90" r="5"/>
    <line x1="30" y1="90" x2="80" y2="90"/>
    <rect x="80" y="78" width="60" height="24" fill="#fff"/>
    <line x1="140" y1="90" x2="200" y2="90"/>
    <rect x="200" y="78" width="60" height="24" fill="#fff"/>
    <line x1="260" y1="90" x2="315" y2="90"/>
    <circle cx="320" cy="90" r="5"/>
  </g>
  <circle cx="170" cy="90" r="7" fill="#dc2626"/>
  <text x="95" y="68" fill="#111827" font-size="22" font-style="italic">R<tspan font-size="16" dy="6">1</tspan></text>
  <text x="215" y="68" fill="#111827" font-size="22" font-style="italic">R<tspan font-size="16" dy="6">2</tspan></text>

  <!-- ===== rechts: Parallelschaltung ===== -->
  <g stroke="#111827" stroke-width="2.5" fill="none">
    <circle cx="445" cy="90" r="5"/>
    <line x1="450" y1="90" x2="500" y2="90"/>
    <line x1="500" y1="45" x2="500" y2="135"/>
    <line x1="500" y1="45" x2="540" y2="45"/>
    <rect x="540" y="33" width="60" height="24" fill="#fff"/>
    <line x1="600" y1="45" x2="660" y2="45"/>
    <line x1="500" y1="135" x2="540" y2="135"/>
    <rect x="540" y="123" width="60" height="24" fill="#fff"/>
    <line x1="600" y1="135" x2="660" y2="135"/>
    <line x1="660" y1="45" x2="660" y2="135"/>
    <line x1="660" y1="90" x2="745" y2="90"/>
    <circle cx="750" cy="90" r="5"/>
  </g>
  <circle cx="500" cy="90" r="7" fill="#dc2626"/>
  <circle cx="660" cy="90" r="7" fill="#dc2626"/>
  <text x="555" y="23" fill="#111827" font-size="22" font-style="italic">R<tspan font-size="16" dy="6">1</tspan></text>
  <text x="555" y="170" fill="#111827" font-size="22" font-style="italic">R<tspan font-size="16" dy="6">2</tspan></text>
</svg>
