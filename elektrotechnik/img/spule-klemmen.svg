<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="mU" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Klemmen und Zuleitungen -->
  <g stroke="#111827" stroke-width="3" fill="none">
    <line x1="40" y1="110" x2="130" y2="110"/>
    <line x1="290" y1="110" x2="380" y2="110"/>
    <!-- Spule: vier Bögen -->
    <path d="M130,110 a20,20 0 0 1 40,0 a20,20 0 0 1 40,0 a20,20 0 0 1 40,0 a20,20 0 0 1 40,0"/>
  </g>
  <circle cx="34" cy="110" r="6" fill="#fff" stroke="#111827" stroke-width="2.5"/>
  <circle cx="386" cy="110" r="6" fill="#fff" stroke="#111827" stroke-width="2.5"/>
  <text x="210" y="70" fill="#111827" font-size="24" font-style="italic" text-anchor="middle">L</text>

  <!-- Stromzählpfeil -->
  <line x1="50" y1="88" x2="105" y2="88" stroke="#111827" stroke-width="3" marker-end="url(#mI)"/>
  <text x="70" y="78" fill="#111827" font-size="22" font-style="italic">I</text>

  <!-- Spannungszählpfeil, gleichsinnig (Verbraucherzählpfeilsystem) -->
  <line x1="60" y1="160" x2="360" y2="160" stroke="#2563eb" stroke-width="3" marker-end="url(#mU)"/>
  <text x="210" y="195" fill="#2563eb" font-size="22" font-style="italic" text-anchor="middle">U = L · dI/dt</text>
</svg>
