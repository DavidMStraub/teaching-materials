  <text x="585" y="222" fill="#111827" font-size="20" font-style="italic" text-anchor="middle">v</text>

  <!-- Legende -->
  <text x="35" y="266" fill="#6b7280" font-size="17">✕ = <tspan font-style="italic">B</tspan> in die Zeichenebene hinein; außerhalb des blauen Bereichs ist <tspan font-style="italic">B</tspan> = 0</text>
