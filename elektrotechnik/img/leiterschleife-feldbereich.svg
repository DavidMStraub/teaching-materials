  <text x="80" y="222" fill="#111827" font-size="20" font-style="italic" text-anchor="middle">v</text>

  <!-- ===== Panel 2 ===== -->
  <rect x="280" y="70" width="130" height="105" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <g stroke="#2563eb" stroke-width="2">
