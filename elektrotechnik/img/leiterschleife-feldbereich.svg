  </g>
  <rect x="290" y="88" width="110" height="70" fill="none" stroke="#111827" stroke-width="3.5"/>
  <line x1="320" y1="200" x2="370" y2="200" stroke="#111827" stroke-width="3" marker-end="url(#lv)"/>
  <text x="340" y="222" fill="#111827" font-size="20" font-style="italic" text-anchor="middle">v</text>

  <!-- ===== Panel 3 ===== -->
  <rect x="490" y="70" width="130" height="105" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <g stroke="#2563eb" stroke-width="2">
