<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 40 420 530" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="accBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="accRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- Koordinatenachsen -->
  <line x1="60" y1="530" x2="420" y2="530" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrGray)"/>
  <line x1="60" y1="530" x2="60" y2="60" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrGray)"/>
  <text x="410" y="560" fill="#6b7280" font-size="26" font-style="italic">x</text>
  <text x="30" y="75" fill="#6b7280" font-size="26" font-style="italic">y</text>

  <!-- Betrag als Maßlinie, links neben v -->
  <g stroke="#4b5563" stroke-width="2">
    <line x1="116" y1="448" x2="326" y2="123"/>
    <line x1="104" y1="440" x2="128" y2="456"/>
    <line x1="314" y1="115" x2="338" y2="131"/>
  </g>
  <text transform="translate(196,262) rotate(-57)" text-anchor="middle" fill="#4b5563" font-size="28">
    Betrag <tspan font-style="italic">v</tspan> = {<tspan font-style="italic">v</tspan>}·[<tspan font-style="italic">v</tspan>]
  </text>

  <!-- Vektor v -->
  <line x1="150" y1="470" x2="360" y2="145" stroke="#1d4ed8" stroke-width="7" marker-end="url(#arrBlue)"/>
  <text x="292" y="342" fill="#1d4ed8" font-size="44" font-style="italic">v</text>
  <line x1="292" y1="306" x2="318" y2="306" stroke="#1d4ed8" stroke-width="3" marker-end="url(#accBlue)"/>

  <!-- Einheitsvektor e_v, rechts neben v -->
  <line x1="180" y1="490" x2="220" y2="428" stroke="#b91c1c" stroke-width="7" marker-end="url(#arrRed)"/>
  <text x="236" y="486" fill="#b91c1c" font-size="40" font-style="italic">e<tspan font-size="26" dy="9">v</tspan></text>
  <line x1="237" y1="448" x2="262" y2="448" stroke="#b91c1c" stroke-width="3" marker-end="url(#accRed)"/>
  <text x="236" y="518" fill="#b91c1c" font-size="24">Länge 1</text>
</svg>
