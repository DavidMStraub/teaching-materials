<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 230" font-family="Helvetica, Arial, sans-serif">
  <!-- Querschnitt: Hinleiter (aus der Tafel), Rückleiter (in die Tafel) -->
  <line x1="60" y1="110" x2="400" y2="110" stroke="#9ca3af" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="90" cy="110" r="26" fill="#fff" stroke="#111827" stroke-width="3"/>
  <circle cx="90" cy="110" r="6" fill="#111827"/>
  <circle cx="370" cy="110" r="26" fill="#fff" stroke="#111827" stroke-width="3"/>
  <line x1="352" y1="92" x2="388" y2="128" stroke="#111827" stroke-width="3"/>
  <line x1="388" y1="92" x2="352" y2="128" stroke="#111827" stroke-width="3"/>
  <text x="90" y="60" fill="#ef4444" font-size="28" font-style="italic" text-anchor="middle">I</text>
  <text x="370" y="60" fill="#ef4444" font-size="28" font-style="italic" text-anchor="middle">I</text>
  <!-- Aufpunkt P im Abstand x -->
  <circle cx="180" cy="110" r="6" fill="#2563eb"/>
  <text x="180" y="96" fill="#2563eb" font-size="26" font-weight="bold" text-anchor="middle">P</text>
  <line x1="90" y1="150" x2="180" y2="150" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="180" y1="150" x2="370" y2="150" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="180" y1="140" x2="180" y2="160" stroke="#6b7280" stroke-width="1.5"/>
  <text x="135" y="144" fill="#6b7280" font-size="24" font-style="italic" text-anchor="middle">x</text>
  <text x="275" y="144" fill="#6b7280" font-size="24" font-style="italic" text-anchor="middle">a − x</text>
  <!-- Achsabstand a -->
  <line x1="90" y1="140" x2="90" y2="196" stroke="#111827" stroke-width="1.5"/>
  <line x1="370" y1="140" x2="370" y2="196" stroke="#111827" stroke-width="1.5"/>
  <line x1="102" y1="185" x2="358" y2="185" stroke="#111827" stroke-width="2"/>
  <polygon points="92,185 104,180 104,190" fill="#111827"/>
  <polygon points="368,185 356,180 356,190" fill="#111827"/>
  <text x="230" y="220" fill="#111827" font-size="28" font-style="italic" text-anchor="middle">a</text>
</svg>
