<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 600 280" font-family="Helvetica, Arial, sans-serif">
  <!-- Spannungsteiler: Quelle U, R1, R2 -->
  <g stroke="#111827" stroke-width="2.5" fill="none">
    <line x1="70" y1="60" x2="70" y2="124"/>
    <circle cx="70" cy="150" r="26" fill="#fff"/>
    <line x1="70" y1="124" x2="70" y2="176"/>
    <line x1="70" y1="176" x2="70" y2="250"/>
    <line x1="70" y1="60" x2="130" y2="60"/>
    <rect x="130" y="48" width="80" height="24" fill="#fff"/>
    <line x1="210" y1="60" x2="374" y2="60"/>
    <line x1="270" y1="60" x2="270" y2="110"/>
    <rect x="258" y="110" width="24" height="80" fill="#fff"/>
    <line x1="270" y1="190" x2="270" y2="250"/>
    <line x1="70" y1="250" x2="374" y2="250"/>
  </g>
  <circle cx="270" cy="60" r="6" fill="#111827"/>
  <circle cx="270" cy="250" r="6" fill="#111827"/>
  <!-- Klemmen a, b -->
  <circle cx="380" cy="60" r="6" fill="#fff" stroke="#111827" stroke-width="2.5"/>
  <circle cx="380" cy="250" r="6" fill="#fff" stroke="#111827" stroke-width="2.5"/>
  <text x="372" y="38" fill="#111827" font-size="26" font-weight="bold">a</text>
  <text x="372" y="286" fill="#111827" font-size="26" font-weight="bold">b</text>
  <!-- Verbraucher R_L (wechselnd, gestrichelt) -->
  <g stroke="#6b7280" stroke-width="2.5" fill="none" stroke-dasharray="7 5">
    <line x1="386" y1="60" x2="520" y2="60"/>
    <line x1="520" y1="60" x2="520" y2="110"/>
    <rect x="508" y="110" width="24" height="80"/>
    <line x1="520" y1="190" x2="520" y2="250"/>
    <line x1="520" y1="250" x2="386" y2="250"/>
  </g>
  <!-- Strom zum Verbraucher -->
  <polygon points="482,60 468,53 468,67" fill="#ef4444"/>
  <text x="466" y="42" fill="#ef4444" font-size="28" font-style="italic">I</text>
  <!-- Klemmenspannung -->
  <line x1="420" y1="95" x2="420" y2="203" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="420,215 415,202 425,202" fill="#2563eb"/>
  <text x="430" y="162" fill="#2563eb" font-size="28" font-style="italic">U<tspan font-size="20" dy="7">a</tspan></text>
  <!-- Beschriftungen -->
  <text x="30" y="160" fill="#111827" font-size="28" font-style="italic" text-anchor="end">U</text>
  <text x="156" y="36" fill="#111827" font-size="28" font-style="italic">R<tspan font-size="20" dy="7">1</tspan></text>
  <text x="290" y="160" fill="#111827" font-size="28" font-style="italic">R<tspan font-size="20" dy="7">2</tspan></text>
  <text x="542" y="160" fill="#6b7280" font-size="28" font-style="italic">R<tspan font-size="20" dy="7">L</tspan></text>
</svg>
