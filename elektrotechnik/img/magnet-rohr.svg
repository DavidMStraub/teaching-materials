<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Rohr 1: Kupfer -->
  <rect x="70" y="120" width="80" height="270" fill="#fcd9a8" stroke="#b45309" stroke-width="3"/>
  <rect x="88" y="120" width="44" height="270" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="110" y="425" fill="#b45309" font-size="22" text-anchor="middle">Kupfer</text>

  <!-- Rohr 2: Kunststoff -->
  <rect x="270" y="120" width="80" height="270" fill="#e5e7eb" stroke="#6b7280" stroke-width="3"/>
  <rect x="288" y="120" width="44" height="270" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="310" y="425" fill="#6b7280" font-size="22" text-anchor="middle">Kunststoff</text>

  <!-- Magnete -->
  <g font-size="18" font-weight="bold" text-anchor="middle">
    <rect x="95" y="20" width="30" height="25" fill="#ef4444"/>
    <rect x="95" y="45" width="30" height="25" fill="#2563eb"/>
    <text x="110" y="39" fill="#fff">N</text>
    <text x="110" y="64" fill="#fff">S</text>
    <rect x="295" y="20" width="30" height="25" fill="#ef4444"/>
    <rect x="295" y="45" width="30" height="25" fill="#2563eb"/>
    <text x="310" y="39" fill="#fff">N</text>
    <text x="310" y="64" fill="#fff">S</text>
  </g>

  <!-- Fallrichtung -->
  <line x1="170" y1="40" x2="170" y2="100" stroke="#6b7280" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="370" y1="40" x2="370" y2="100" stroke="#6b7280" stroke-width="3" marker-end="url(#ar)"/>
</svg>
