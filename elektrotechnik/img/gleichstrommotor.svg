<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <g id="aus">
      <circle r="16" fill="#fff" stroke="#111827" stroke-width="3"/>
      <circle r="5" fill="#111827"/>
    </g>
    <g id="ein">
      <circle r="16" fill="#fff" stroke="#111827" stroke-width="3"/>
      <line x1="-10" y1="-10" x2="10" y2="10" stroke="#111827" stroke-width="3"/>
      <line x1="-10" y1="10" x2="10" y2="-10" stroke="#111827" stroke-width="3"/>
    </g>
  </defs>
  <!-- Pole -->
  <rect x="10" y="90" width="70" height="200" fill="#ef4444" opacity="0.85"/>
  <rect x="440" y="90" width="70" height="200" fill="#22c55e" opacity="0.85"/>
  <text x="45" y="202" fill="#fff" font-size="40" font-weight="bold" text-anchor="middle">N</text>
  <text x="475" y="202" fill="#fff" font-size="40" font-weight="bold" text-anchor="middle">S</text>
  <!-- Feldlinien -->
  <g stroke="#93c5fd" stroke-width="2.5">
    <line x1="80" y1="110" x2="440" y2="110"/>
    <line x1="80" y1="150" x2="440" y2="150"/>
    <line x1="80" y1="230" x2="440" y2="230"/>
    <line x1="80" y1="270" x2="440" y2="270"/>
  </g>
  <g fill="#93c5fd">
    <polygon points="140,110 126,104 126,116"/>
    <polygon points="140,150 126,144 126,156"/>
    <polygon points="140,230 126,224 126,236"/>
    <polygon points="140,270 126,264 126,276"/>
  </g>
  <text x="96" y="80" fill="#2563eb" font-size="30" font-style="italic">B</text>
  <!-- Rotor -->
  <circle cx="260" cy="190" r="110" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="150" y1="190" x2="370" y2="190" stroke="#111827" stroke-width="2.5"/>
  <circle cx="260" cy="190" r="6" fill="#111827"/>
  <use href="#aus" x="150" y="190"/>
  <use href="#ein" x="370" y="190"/>
  <text x="118" y="228" fill="#111827" font-size="26" font-style="italic">I</text>
  <text x="390" y="228" fill="#111827" font-size="26" font-style="italic">I</text>
  <!-- Kräfte -->
  <line x1="150" y1="172" x2="150" y2="96" stroke="#ef4444" stroke-width="4"/>
  <polygon points="150,80 142,98 158,98" fill="#ef4444"/>
  <text x="162" y="100" fill="#ef4444" font-size="30" font-style="italic">F</text>
  <line x1="370" y1="208" x2="370" y2="284" stroke="#ef4444" stroke-width="4"/>
  <polygon points="370,300 362,282 378,282" fill="#ef4444"/>
  <text x="382" y="296" fill="#ef4444" font-size="30" font-style="italic">F</text>
  <!-- Radius -->
  <text x="300" y="180" fill="#111827" font-size="26" font-style="italic">r</text>
  <!-- Drehsinn -->
  <path d="M 230 52 A 140 140 0 0 1 330 64" fill="none" stroke="#b45309" stroke-width="3"/>
  <polygon points="344,72 326,72 334,57" fill="#b45309"/>
  <text x="270" y="38" fill="#b45309" font-size="28" font-style="italic">M</text>
</svg>
