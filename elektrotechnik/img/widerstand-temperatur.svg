<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>

  <!-- Achsen -->
  <line x1="60" y1="320" x2="390" y2="320" stroke="#111827" stroke-width="2.5" marker-end="url(#aK)"/>
  <line x1="60" y1="320" x2="60" y2="30" stroke="#111827" stroke-width="2.5" marker-end="url(#aK)"/>
  <text x="392" y="348" fill="#111827" font-size="24" font-style="italic">T</text>
  <text x="22" y="45" fill="#111827" font-size="24" font-style="italic">R</text>

  <!-- gemessener Verlauf (leicht gekrümmt) -->
  <path d="M 70,280 Q 230,150 380,70" fill="none" stroke="#111827" stroke-width="4"/>
  <text x="380" y="125" fill="#111827" font-size="20" text-anchor="end">Messung</text>

  <!-- Tangente in T0: lineare Näherung -->
  <line x1="70" y1="276" x2="380" y2="50" stroke="#2563eb" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="250" y="100" fill="#2563eb" font-size="20" text-anchor="end">lineare Näherung</text>

  <!-- Bezugspunkt T0, R(T0) -->
  <line x1="170" y1="203" x2="170" y2="320" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="60" y1="203" x2="170" y2="203" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="170" cy="203" r="7" fill="#2563eb"/>
  <text x="170" y="350" fill="#111827" font-size="22" font-style="italic" text-anchor="middle">T<tspan font-size="16" dy="6">0</tspan></text>
  <text x="55" y="210" fill="#111827" font-size="20" font-style="italic" text-anchor="end">R(T<tspan font-size="14" dy="5">0</tspan><tspan dy="-5">)</tspan></text>
</svg>
