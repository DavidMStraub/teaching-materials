<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" font-family="Helvetica, Arial, sans-serif">
  <text x="10" y="28" fill="#111827" font-size="24" font-weight="bold">e)</text>
  <g stroke="#111827" stroke-width="2.5" fill="none">
    <!-- Klemmen -->
    <circle cx="25" cy="50" r="5"/>
    <circle cx="25" cy="180" r="5"/>
    <!-- obere Schiene -->
    <line x1="30" y1="50" x2="280" y2="50"/>
    <!-- untere Schiene links -->
    <line x1="30" y1="180" x2="180" y2="180"/>
    <!-- R1 senkrecht -->
    <line x1="140" y1="50" x2="140" y2="90"/>
    <rect x="128" y="90" width="24" height="60" fill="#fff"/>
    <line x1="140" y1="150" x2="140" y2="180"/>
    <!-- R2 senkrecht -->
    <line x1="280" y1="50" x2="280" y2="90"/>
    <rect x="268" y="90" width="24" height="60" fill="#fff"/>
    <line x1="280" y1="150" x2="280" y2="180"/>
    <!-- R3 in der unteren Schiene -->
    <rect x="180" y="168" width="60" height="24" fill="#fff"/>
    <line x1="240" y1="180" x2="280" y2="180"/>
  </g>
  <circle cx="140" cy="50" r="5" fill="#111827"/>
  <circle cx="140" cy="180" r="5" fill="#111827"/>
  <text x="90" y="128" fill="#111827" font-size="22" font-style="italic">R<tspan font-size="16" dy="6">1</tspan></text>
  <text x="300" y="128" fill="#111827" font-size="22" font-style="italic">R<tspan font-size="16" dy="6">2</tspan></text>
  <text x="195" y="218" fill="#111827" font-size="22" font-style="italic">R<tspan font-size="16" dy="6">3</tspan></text>
</svg>
