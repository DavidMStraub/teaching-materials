<svg xmlns="http://www.w3.org/2000/svg" viewBox="75 35 350 355" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrE1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrEs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="vecB2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="vecD3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>

  <!-- Verbindungslinien Ladung -> Aufpunkt: zeigen die Richtung der Teilfelder -->
  <line x1="110" y1="310" x2="250" y2="190" stroke="#d1d5db" stroke-width="2"/>
  <line x1="390" y1="310" x2="250" y2="190" stroke="#d1d5db" stroke-width="2"/>

  <!-- Parallelogramm-Hilfslinien -->
  <line x1="310.7" y1="137.9" x2="250" y2="85.8" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="189.3" y1="137.9" x2="250" y2="85.8" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- Teilfelder E1, E2 (jeweils von der Ladung weg) -->
  <line x1="250" y1="190" x2="310.7" y2="137.9" stroke="#2563eb" stroke-width="4" marker-end="url(#arrE1)"/>
  <line x1="250" y1="190" x2="189.3" y2="137.9" stroke="#2563eb" stroke-width="4" marker-end="url(#arrE1)"/>

  <!-- Resultierendes Feld -->
  <line x1="250" y1="190" x2="250" y2="85.8" stroke="#111827" stroke-width="5" marker-end="url(#arrEs)"/>

  <!-- Aufpunkt P -->
  <circle cx="250" cy="190" r="6" fill="#111827"/>
  <text x="262" y="214" fill="#111827" font-size="24" font-style="italic">P</text>

  <!-- Ladungen -->
  <circle cx="110" cy="310" r="26" fill="#ef4444"/>
  <text x="110" y="321" fill="#fff" font-size="32" text-anchor="middle" font-weight="bold">+</text>
  <text x="98" y="368" fill="#111827" font-size="24" font-style="italic">Q<tspan font-size="17" dy="6">1</tspan></text>

  <circle cx="390" cy="310" r="26" fill="#ef4444"/>
  <text x="390" y="321" fill="#fff" font-size="32" text-anchor="middle" font-weight="bold">+</text>
  <text x="378" y="368" fill="#111827" font-size="24" font-style="italic">Q<tspan font-size="17" dy="6">2</tspan></text>

  <!-- Vektor-Beschriftungen -->
  <text x="322" y="145" fill="#2563eb" font-size="24" font-style="italic">E<tspan font-size="17" dy="6">1</tspan></text>
  <line x1="322" y1="119" x2="340" y2="119" stroke="#2563eb" stroke-width="2.5" marker-end="url(#vecB2)"/>

  <text x="142" y="145" fill="#2563eb" font-size="24" font-style="italic">E<tspan font-size="17" dy="6">2</tspan></text>
  <line x1="142" y1="119" x2="160" y2="119" stroke="#2563eb" stroke-width="2.5" marker-end="url(#vecB2)"/>

  <text x="266" y="82" fill="#111827" font-size="26" font-style="italic">E</text>
  <line x1="266" y1="54" x2="286" y2="54" stroke="#111827" stroke-width="2.8" marker-end="url(#vecD3)"/>
</svg>
