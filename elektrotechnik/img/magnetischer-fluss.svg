<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 30 460 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="vecN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="vecB3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- B-Feldlinien -->
  <g stroke="#2563eb" stroke-width="3" marker-end="url(#fB)">
    <line x1="60" y1="70" x2="430" y2="70"/>
    <line x1="60" y1="120" x2="430" y2="120"/>
    <line x1="60" y1="170" x2="430" y2="170"/>
    <line x1="60" y1="220" x2="430" y2="220"/>
    <line x1="60" y1="270" x2="430" y2="270"/>
  </g>
  <text x="60" y="52" fill="#2563eb" font-size="23" font-style="italic">B</text>
  <line x1="60" y1="26" x2="78" y2="26" stroke="#2563eb" stroke-width="2.5" marker-end="url(#vecB3)"/>

  <!-- Fläche A, schräg (von der Seite gesehen) -->
  <line x1="240" y1="90" x2="320" y2="250" stroke="#111827" stroke-width="7"/>
  <text x="332" y="252" fill="#111827" font-size="24" font-style="italic">A</text>

  <!-- Normalenvektor -->
  <line x1="280" y1="170" x2="360" y2="130" stroke="#111827" stroke-width="3.5" marker-end="url(#fN)"/>
  <text x="366" y="120" fill="#111827" font-size="23" font-style="italic">n</text>
  <line x1="366" y1="94" x2="382" y2="94" stroke="#111827" stroke-width="2.5" marker-end="url(#vecN)"/>

  <!-- Winkel alpha zwischen B (waagrecht) und n -->
  <path d="M 322 170 A 42 42 0 0 0 316 149" fill="none" stroke="#6b7280" stroke-width="2"/>
  <text x="326" y="158" fill="#6b7280" font-size="20" font-style="italic">&#945;</text>

  <text x="120" y="316" fill="#111827" font-size="21" font-style="italic">&#934; = B &#183; A &#183; cos &#945;</text>
</svg>
