<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 60 560 220" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="accDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="accGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Abstand r -->
  <line x1="155" y1="160" x2="345" y2="160" stroke="#9ca3af" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="250" y="145" fill="#6b7280" font-size="34" font-style="italic" text-anchor="middle">r</text>

  <!-- Einheitsvektor r/r (von Q1 nach Q2) -->
  <line x1="205" y1="215" x2="295" y2="215" stroke="#6b7280" stroke-width="4" marker-end="url(#arrR)"/>
  <text x="250" y="266" fill="#6b7280" font-size="32" text-anchor="middle"><tspan font-style="italic">r</tspan> / <tspan font-style="italic">r</tspan></text>
  <line x1="227" y1="234" x2="245" y2="234" stroke="#6b7280" stroke-width="2.5" marker-end="url(#accGray)"/>

  <!-- Q1 -->
  <circle cx="120" cy="160" r="34" fill="#ef4444"/>
  <text x="120" y="173" fill="#fff" font-size="40" text-anchor="middle" font-weight="bold">+</text>
  <text x="104" y="238" fill="#111827" font-size="34" font-style="italic">Q<tspan font-size="22" dy="7">1</tspan></text>

  <!-- Q2 -->
  <circle cx="380" cy="160" r="34" fill="#ef4444"/>
  <text x="380" y="173" fill="#fff" font-size="40" text-anchor="middle" font-weight="bold">+</text>
  <text x="364" y="238" fill="#111827" font-size="34" font-style="italic">Q<tspan font-size="22" dy="7">2</tspan></text>

  <!-- Kraft auf Q2 -->
  <line x1="422" y1="160" x2="530" y2="160" stroke="#111827" stroke-width="6" marker-end="url(#arrF)"/>
  <text x="450" y="128" fill="#111827" font-size="36" font-style="italic">F<tspan font-size="22" dy="8">12</tspan></text>
  <line x1="451" y1="94" x2="473" y2="94" stroke="#111827" stroke-width="2.5" marker-end="url(#accDark)"/>

  <!-- Kraft auf Q1 -->
  <line x1="78" y1="160" x2="-10" y2="160" stroke="#111827" stroke-width="6" marker-end="url(#arrF)"/>
  <text x="0" y="128" fill="#111827" font-size="36" font-style="italic">F<tspan font-size="22" dy="8">21</tspan></text>
  <line x1="1" y1="94" x2="23" y2="94" stroke="#111827" stroke-width="2.5" marker-end="url(#accDark)"/>
</svg>
