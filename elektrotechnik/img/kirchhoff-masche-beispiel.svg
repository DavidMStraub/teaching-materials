<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 260" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mU" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <!-- Masche: Quelle links, R1 oben, R2 rechts -->
  <g stroke="#111827" stroke-width="2.5" fill="none">
    <line x1="100" y1="70" x2="100" y2="124"/>
    <circle cx="100" cy="150" r="26"/>
    <line x1="100" y1="124" x2="100" y2="176"/>
    <line x1="100" y1="176" x2="100" y2="230"/>
    <line x1="100" y1="70" x2="180" y2="70"/>
    <rect x="180" y="58" width="80" height="24" fill="#fff"/>
    <line x1="260" y1="70" x2="340" y2="70"/>
    <line x1="340" y1="70" x2="340" y2="110"/>
    <rect x="328" y="110" width="24" height="80" fill="#fff"/>
    <line x1="340" y1="190" x2="340" y2="230"/>
    <line x1="340" y1="230" x2="100" y2="230"/>
  </g>
  <text x="122" y="118" fill="#111827" font-size="26">+</text>
  <!-- Umlaufsinn -->
  <path d="M 220,122 A 28,28 0 1 1 192,150" stroke="#9ca3af" stroke-width="3" fill="none"/>
  <polygon points="192,136 186,151 198,151" fill="#9ca3af"/>
  <!-- Spannungspfeile -->
  <g stroke="#2563eb" stroke-width="2.5" fill="none">
    <line x1="55" y1="115" x2="55" y2="185" marker-end="url(#mU)"/>
    <line x1="180" y1="38" x2="260" y2="38" marker-end="url(#mU)"/>
    <line x1="385" y1="110" x2="385" y2="190" marker-end="url(#mU)"/>
  </g>
  <text x="4" y="158" fill="#2563eb" font-size="28" font-style="italic">U<tspan font-size="20" dy="7">q</tspan></text>
  <text x="206" y="28" fill="#2563eb" font-size="28" font-style="italic">U<tspan font-size="20" dy="7">1</tspan></text>
  <text x="398" y="158" fill="#2563eb" font-size="28" font-style="italic">U<tspan font-size="20" dy="7">2</tspan></text>
</svg>
