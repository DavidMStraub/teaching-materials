<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 30 620 240" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="zI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="zU" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ===== Verbraucher ===== -->
  <text x="60" y="58" fill="#111827" font-size="23" font-weight="bold">Verbraucher</text>

  <g stroke="#111827" stroke-width="2.5" fill="none">
    <line x1="60" y1="150" x2="130" y2="150"/>
    <rect x="130" y="134" width="80" height="32" fill="#fff"/>
    <line x1="210" y1="150" x2="280" y2="150"/>
  </g>
  <!-- I oben, U unten: gleiche Richtung -->
  <line x1="135" y1="108" x2="205" y2="108" stroke="#111827" stroke-width="3.5" marker-end="url(#zI)"/>
  <text x="163" y="98" fill="#111827" font-size="23" font-style="italic">I</text>
  <line x1="135" y1="196" x2="205" y2="196" stroke="#6b7280" stroke-width="3" marker-end="url(#zU)"/>
  <text x="161" y="224" fill="#6b7280" font-size="23" font-style="italic">U</text>

  <text x="60" y="256" fill="#111827" font-size="18">gleichsinnig → <tspan font-style="italic">P</tspan> &gt; 0: nimmt auf</text>

  <!-- ===== Erzeuger ===== -->
  <text x="400" y="58" fill="#111827" font-size="23" font-weight="bold">Erzeuger</text>

  <g stroke="#111827" stroke-width="2.5" fill="none">
    <line x1="380" y1="150" x2="464" y2="150"/>
    <circle cx="490" cy="150" r="26"/>
    <line x1="490" y1="124" x2="490" y2="176"/>
    <line x1="516" y1="150" x2="600" y2="150"/>
  </g>
  <!-- I oben rechts, U unten links: entgegengesetzt -->
  <line x1="455" y1="108" x2="525" y2="108" stroke="#111827" stroke-width="3.5" marker-end="url(#zI)"/>
  <text x="483" y="98" fill="#111827" font-size="23" font-style="italic">I</text>
  <line x1="525" y1="196" x2="455" y2="196" stroke="#6b7280" stroke-width="3" marker-end="url(#zU)"/>
  <text x="481" y="224" fill="#6b7280" font-size="23" font-style="italic">U</text>

  <text x="380" y="256" fill="#111827" font-size="18">gegensinnig → <tspan font-style="italic">P</tspan> &gt; 0: gibt ab</text>
</svg>
