<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 40 662 305" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mPhi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="mArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="mI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>

  <!-- ===== Kern: ein durchgehender Pfad, saubere Ecken, Lücke = Luftspalt ===== -->
  <path d="M 280,160 L 280,90 L 90,90 L 90,290 L 280,290 L 280,205"
        fill="none" stroke="#9ca3af" stroke-width="20"
        stroke-linejoin="miter" stroke-linecap="butt"/>

  <text x="298" y="190" fill="#111827" font-size="21" font-style="italic">&#948;</text>

  <!-- ===== Wicklung als Wendel: sichtbare Vorderbögen, verdeckte Rückseite gestrichelt ===== -->
  <g stroke="#111827" stroke-width="2.5" fill="none">
    <path d="M 63,130 A 27,9 0 0 0 117,130"/>
    <path d="M 63,162 A 27,9 0 0 0 117,162"/>
    <path d="M 63,194 A 27,9 0 0 0 117,194"/>
    <path d="M 63,226 A 27,9 0 0 0 117,226"/>
  </g>
  <g stroke="#111827" stroke-width="2" fill="none" stroke-dasharray="4 4" opacity="0.55">
    <line x1="117" y1="130" x2="63" y2="162"/>
    <line x1="117" y1="162" x2="63" y2="194"/>
    <line x1="117" y1="194" x2="63" y2="226"/>
    <line x1="117" y1="226" x2="63" y2="258"/>
  </g>
  <!-- Anschlussdrähte -->
  <g stroke="#111827" stroke-width="2.5" fill="none">
    <line x1="63" y1="130" x2="34" y2="112"/>
    <line x1="63" y1="258" x2="34" y2="276"/>
  </g>
  <!-- Stromrichtung: fließt unten in die Wicklung -->
  <line x1="26" y1="288" x2="56" y2="269" stroke="#111827" stroke-width="3.5" marker-end="url(#mI)"/>
  <text x="24" y="312" fill="#111827" font-size="21" font-style="italic">I</text>
  <text x="40" y="196" fill="#111827" font-size="21" font-style="italic">N</text>

  <!-- Fluss im Kern -->
  <line x1="150" y1="63" x2="225" y2="63" stroke="#2563eb" stroke-width="4" marker-end="url(#mPhi)"/>
  <text x="178" y="55" fill="#2563eb" font-size="22" font-style="italic">&#934;</text>

  <text x="108" y="336" fill="#6b7280" font-size="19">Magnetkreis</text>

  <!-- „entspricht" -->
  <line x1="330" y1="140" x2="382" y2="140" stroke="#6b7280" stroke-width="3.5" marker-end="url(#mArr)"/>

  <!-- ===== Rechts: Ersatzschaltbild ===== -->
  <g stroke="#111827" stroke-width="2.5" fill="none">
    <line x1="430" y1="110" x2="490" y2="110"/>
    <rect x="490" y="98" width="60" height="24" fill="#fff"/>
    <line x1="550" y1="110" x2="630" y2="110"/>
    <line x1="630" y1="110" x2="630" y2="160"/>
    <rect x="618" y="160" width="24" height="56" fill="#fff"/>
    <line x1="630" y1="216" x2="630" y2="270"/>
    <line x1="630" y1="270" x2="430" y2="270"/>
    <line x1="430" y1="270" x2="430" y2="212"/>
    <circle cx="430" cy="190" r="22"/>
    <line x1="430" y1="168" x2="430" y2="212"/>
    <line x1="430" y1="168" x2="430" y2="110"/>
  </g>

  <text x="402" y="197" fill="#111827" font-size="21" font-style="italic" text-anchor="end">&#920;</text>
  <text x="520" y="88" fill="#111827" font-size="19" font-style="italic" text-anchor="middle">R<tspan font-size="14" dy="5">m,Fe</tspan></text>
  <text x="606" y="195" fill="#111827" font-size="19" font-style="italic" text-anchor="end">R<tspan font-size="14" dy="5">m,L</tspan></text>

  <line x1="550" y1="248" x2="490" y2="248" stroke="#2563eb" stroke-width="3.5" marker-end="url(#mPhi)"/>
  <text x="512" y="240" fill="#2563eb" font-size="20" font-style="italic">&#934;</text>

  <text x="452" y="336" fill="#6b7280" font-size="19">Ersatzschaltbild</text>
</svg>
