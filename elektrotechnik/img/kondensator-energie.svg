<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>

  <!-- Fläche unter U(q) = gespeicherte Energie -->
  <polygon points="60,300 340,300 340,80" fill="#2563eb" fill-opacity="0.15"/>
  <!-- Streifen U(q)·dq -->
  <rect x="140" y="237" width="18" height="63" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.5"/>
  <text x="149" y="325" fill="#2563eb" font-size="18" text-anchor="middle" font-style="italic">dq</text>

  <!-- Achsen -->
  <line x1="60" y1="300" x2="390" y2="300" stroke="#111827" stroke-width="2.5" marker-end="url(#aK)"/>
  <line x1="60" y1="300" x2="60" y2="30" stroke="#111827" stroke-width="2.5" marker-end="url(#aK)"/>
  <text x="392" y="328" fill="#111827" font-size="24" font-style="italic">q</text>
  <text x="72" y="40" fill="#111827" font-size="24" font-style="italic">U(q)</text>

  <!-- Kennlinie U = q/C -->
  <line x1="60" y1="300" x2="340" y2="80" stroke="#111827" stroke-width="4"/>
  <text x="150" y="180" fill="#111827" font-size="20" font-style="italic" text-anchor="end">U = q/C</text>

  <!-- Endpunkt Q, U -->
  <line x1="340" y1="80" x2="340" y2="300" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="60" y1="80" x2="340" y2="80" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="340" y="328" fill="#111827" font-size="22" font-style="italic" text-anchor="middle">Q</text>
  <text x="40" y="88" fill="#111827" font-size="22" font-style="italic" text-anchor="middle">U</text>

  <text x="275" y="275" fill="#2563eb" font-size="22" font-weight="bold" text-anchor="middle">W = ½ QU</text>
</svg>
