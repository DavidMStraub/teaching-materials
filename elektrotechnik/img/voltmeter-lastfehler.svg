<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 40 580 265" font-family="Helvetica, Arial, sans-serif">
  <g stroke="#111827" stroke-width="2.5" fill="none">
    <!-- Quelle -->
    <circle cx="110" cy="170" r="26"/>
    <line x1="110" y1="144" x2="110" y2="196"/>
    <line x1="110" y1="90" x2="110" y2="144"/>
    <line x1="110" y1="196" x2="110" y2="250"/>
    <!-- Schienen -->
    <line x1="110" y1="90" x2="470" y2="90"/>
    <line x1="110" y1="250" x2="470" y2="250"/>
    <!-- Messobjekt R -->
    <line x1="290" y1="90" x2="290" y2="140"/>
    <rect x="278" y="140" width="24" height="60" fill="#fff"/>
    <line x1="290" y1="200" x2="290" y2="250"/>
    <!-- Voltmeter parallel -->
    <line x1="440" y1="90" x2="440" y2="144" stroke="#15803d"/>
