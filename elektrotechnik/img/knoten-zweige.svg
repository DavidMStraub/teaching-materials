<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 10 490 290" font-family="Helvetica, Arial, sans-serif">
  <!-- Knoten 1 (oben, blau): alles, was nur durch Draht verbunden ist -->
  <g stroke="#2563eb" stroke-width="4" fill="none">
    <line x1="60" y1="60" x2="400" y2="60"/>
    <line x1="60" y1="60" x2="60" y2="124"/>
    <line x1="210" y1="60" x2="210" y2="110"/>
    <line x1="400" y1="60" x2="400" y2="110"/>
  </g>
  <!-- Knoten 2 (unten, rot) -->
  <g stroke="#dc2626" stroke-width="4" fill="none">
    <line x1="60" y1="250" x2="400" y2="250"/>
    <line x1="60" y1="176" x2="60" y2="250"/>
    <line x1="210" y1="190" x2="210" y2="250"/>
    <line x1="400" y1="190" x2="400" y2="250"/>
  </g>
  <circle cx="210" cy="60" r="7" fill="#2563eb"/>
  <circle cx="210" cy="250" r="7" fill="#dc2626"/>
  <text x="220" y="44" fill="#2563eb" font-size="26" font-weight="bold">Knoten 1</text>
  <text x="220" y="282" fill="#dc2626" font-size="26" font-weight="bold">Knoten 2</text>

  <!-- Zweige: Quelle, R1, R2 -->
  <g stroke="#111827" stroke-width="2.5" fill="#fff">
    <circle cx="60" cy="150" r="26"/>
    <line x1="60" y1="124" x2="60" y2="176"/>
    <rect x="198" y="110" width="24" height="80"/>
    <rect x="388" y="110" width="24" height="80"/>
  </g>
  <text x="20" y="158" fill="#111827" font-size="30" font-style="italic" text-anchor="end">U</text>
  <text x="232" y="158" fill="#111827" font-size="30" font-style="italic">R<tspan font-size="22" dy="6">1</tspan></text>
  <text x="422" y="158" fill="#111827" font-size="30" font-style="italic">R<tspan font-size="22" dy="6">2</tspan></text>

  <!-- zwei unabhängige Maschen -->
  <g stroke="#9ca3af" stroke-width="3" fill="none">
    <path d="M 152,140 A 22,22 0 1 1 130,162"/>
    <path d="M 337,140 A 22,22 0 1 1 315,162"/>
  </g>
  <polygon points="130,150 124,163 136,163" fill="#9ca3af"/>
  <polygon points="315,150 309,163 321,163" fill="#9ca3af"/>
</svg>
