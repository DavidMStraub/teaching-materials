<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" font-family="Inter, 'DejaVu Sans', sans-serif">
  <rect width="1100" height="440" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- Modell -->
  <rect x="250" y="20" width="600" height="120" rx="10" fill="#e8f0f9" stroke="#1f6fc4" stroke-width="3"/>
  <text x="550" y="60" text-anchor="middle" fill="#1f6fc4" font-size="26" font-weight="700">Modell in Python</text>
  <text x="550" y="98" text-anchor="middle" fill="#333" font-size="21" font-family="'DejaVu Sans Mono', monospace">ModulParam, zelle_bauen, endplatten,</text>
  <text x="550" y="126" text-anchor="middle" fill="#333" font-size="21" font-family="'DejaVu Sans Mono', monospace">modul(p) → cq.Assembly</text>

  <!-- Pfeile -->
  <g stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M400,140 L200,262"/>
    <path d="M550,140 L550,262"/>
    <path d="M700,140 L900,262"/>
  </g>
  <g font-family="'DejaVu Sans Mono', monospace" font-size="19" fill="#555">
    <text x="262" y="200" text-anchor="end">assy.export(…)</text>
    <text x="562" y="215">assy.export(…)</text>
    <text x="838" y="200">schreibe_bom(…)</text>
  </g>

  <!-- Dateien -->
  <g fill="#f5f7f9" stroke="#333" stroke-width="2.5">
    <rect x="80" y="268" width="240" height="64" rx="6"/>
    <rect x="430" y="268" width="240" height="64" rx="6"/>
    <rect x="780" y="268" width="240" height="64" rx="6"/>
  </g>
  <g font-family="'DejaVu Sans Mono', monospace" font-size="24" fill="#333" text-anchor="middle" font-weight="700">
    <text x="200" y="309">modul.step</text>
    <text x="550" y="309">modul.stl</text>
    <text x="900" y="309">bom.csv</text>
  </g>
  <g font-size="22" fill="#333" text-anchor="middle">
    <text x="200" y="372">Zulieferer, Montage,</text>
    <text x="200" y="400">andere CAD-Systeme</text>
    <text x="550" y="372">3D-Druck</text>
    <text x="900" y="372">Einkauf</text>
  </g>
</svg>
