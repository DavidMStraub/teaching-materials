<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Inter, 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1000" height="440" fill="#ffffff"/>

  <!-- links: flach -->
  <text x="240" y="60" text-anchor="middle" fill="#333" font-size="28" font-weight="600">flach</text>
  <rect x="80" y="330" width="144" height="40" fill="#b8c0ca" stroke="#333" stroke-width="2"/>
  <rect x="256" y="330" width="144" height="40" fill="#b8c0ca" stroke="#333" stroke-width="2"/>
  <text x="240" y="310" text-anchor="middle" fill="#333" font-size="22">Schnitt durch die Bohrung</text>
  <line x1="40" y1="372" x2="440" y2="372" stroke="#333" stroke-width="5"/>
  <text x="240" y="410" text-anchor="middle" fill="#333" font-size="22">Druckbett</text>

  <!-- rechts: hochkant -->
  <text x="750" y="60" text-anchor="middle" fill="#333" font-size="28" font-weight="600">hochkant</text>
  <rect x="590" y="150" width="320" height="220" fill="#b8c0ca" stroke="#333" stroke-width="2"/>
  <circle cx="750" cy="265" r="70" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <!-- 45°-Grenzen -->
  <line x1="750" y1="265" x2="835" y2="180" stroke="#666" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="750" y1="265" x2="665" y2="180" stroke="#666" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="842" y="196" fill="#333" font-size="22">45°</text>
  <!-- Überhang: oberes Viertel -->
  <path d="M799.5,215.5 A70,70 0 0 0 700.5,215.5" fill="none" stroke="#c0392b" stroke-width="8"/>
  <!-- Normalen nach unten -->
  <line x1="750" y1="199" x2="750" y2="236" stroke="#c0392b" stroke-width="3" marker-end="url(#pfeil)"/>
  <line x1="776.8" y1="204.3" x2="763.4" y2="236.6" stroke="#c0392b" stroke-width="3" marker-end="url(#pfeil)"/>
  <line x1="723.2" y1="204.3" x2="736.6" y2="236.6" stroke="#c0392b" stroke-width="3" marker-end="url(#pfeil)"/>
  <line x1="750" y1="191" x2="750" y2="120" stroke="#c0392b" stroke-width="1.5"/>
  <text x="750" y="108" text-anchor="middle" fill="#c0392b" font-size="24" font-weight="600">Überhang</text>
  <line x1="550" y1="372" x2="950" y2="372" stroke="#333" stroke-width="5"/>
  <text x="750" y="410" text-anchor="middle" fill="#333" font-size="22">Druckbett</text>
</svg>
