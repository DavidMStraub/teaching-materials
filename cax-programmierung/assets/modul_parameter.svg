  <text x="256" y="420" text-anchor="middle" fill="#1f6fc4" font-size="26">platten_t = 8</text>
  <line x1="256" y1="428" x2="256" y2="448" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <rect x="120" y="452" width="272" height="16" fill="#eef1f4" stroke="#333" stroke-width="3"/>
