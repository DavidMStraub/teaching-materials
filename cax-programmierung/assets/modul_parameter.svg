    <rect x="130" y="591" width="252" height="17" rx="3"/>
    <rect x="130" y="611" width="252" height="17" rx="3"/>
    <rect x="130" y="631" width="252" height="17" rx="3"/>
    <rect x="130" y="651" width="252" height="17" rx="3"/>
    <rect x="130" y="671" width="252" height="17" rx="3"/>
