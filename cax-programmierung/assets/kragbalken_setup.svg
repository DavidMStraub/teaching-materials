<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Inter, 'DejaVu Sans', sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#c0392b"/>
    </marker>
    <marker id="dim" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="dim2" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M9,0 L0,4 L9,8 Z" fill="#666"/>
    </marker>
  </defs>

  <!-- Wand / Einspannung -->
  <rect x="70" y="120" width="34" height="160" fill="#d9dde1" stroke="#333" stroke-width="2"/>
  <g stroke="#888" stroke-width="2">
    <line x1="70" y1="128" x2="52" y2="146"/><line x1="70" y1="152" x2="52" y2="170"/>
    <line x1="70" y1="176" x2="52" y2="194"/><line x1="70" y1="200" x2="52" y2="218"/>
    <line x1="70" y1="224" x2="52" y2="242"/><line x1="70" y1="248" x2="52" y2="266"/>
  </g>
  <text x="104" y="108" fill="#1f6fc4" font-size="23" font-weight="600">fixed  (&lt;X)</text>

  <!-- Balken (unverformt) -->
  <rect x="104" y="176" width="620" height="48" fill="#eef1f4" stroke="#333" stroke-width="2.5"/>

  <!-- Balken (verformt, gestrichelt) -->
  <path d="M 104,200 Q 500,210 724,272" fill="none" stroke="#1f6fc4" stroke-width="2.5" stroke-dasharray="8 5"/>
  <rect x="712" y="248" width="24" height="48" rx="2" fill="#4a90d9" fill-opacity="0.25" stroke="#1f6fc4" stroke-width="2" transform="rotate(16 724 272)"/>

  <!-- Lastfläche -->
  <text x="724" y="150" text-anchor="middle" fill="#1f6fc4" font-size="23" font-weight="600">load  (&gt;X)</text>

  <!-- Querlast F -->
  <line x1="724" y1="150" x2="724" y2="250" stroke="#c0392b" stroke-width="3.5" marker-end="url(#arr)"/>
  <text x="740" y="205" fill="#c0392b" font-size="26" font-weight="600">F = 200 N</text>

  <!-- Durchbiegung delta -->
  <line x1="724" y1="200" x2="724" y2="272" stroke="#2e7d32" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="640" y="320" fill="#2e7d32" font-size="24" font-weight="600">δ  (gesucht)</text>

  <!-- Länge 120 -->
  <line x1="104" y1="360" x2="724" y2="360" stroke="#666" stroke-width="1.8" marker-start="url(#dim2)" marker-end="url(#dim)"/>
  <text x="414" y="352" text-anchor="middle" fill="#333" font-size="23">L = 120</text>

  <!-- Querschnitt -->
  <text x="414" y="410" text-anchor="middle" fill="#555" font-size="23">Querschnitt 20 × 8 mm · Stahl E = 210 000 MPa, ν = 0,3</text>
</svg>
