<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter, 'DejaVu Sans', sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>

  <!-- ============ links: cap=False -> Schale ============ -->
  <g>
    <!-- Mantelfläche -->
    <path d="M 180,110 L 140,350 A 110,36 0 0 0 360,350 L 320,110 A 70,24 0 0 1 180,110 Z"
          fill="#f2f4f6" stroke="#333333" stroke-width="2.5"/>
    <!-- offene Unterseite: hintere Hälfte gestrichelt -->
    <path d="M 140,350 A 110,36 0 0 1 360,350" fill="none" stroke="#999999" stroke-width="2" stroke-dasharray="7 6"/>
    <!-- offene Oberseite: Blick ins Innere -->
    <ellipse cx="250" cy="110" rx="70" ry="24" fill="#ffffff" stroke="#1f6fc4" stroke-width="3"/>
    <path d="M 190,122 A 62,20 0 0 0 310,122" fill="none" stroke="#bbbbbb" stroke-width="2"/>
    <text x="250" y="70" text-anchor="middle" font-size="25" fill="#777777">offen</text>
  </g>

  <!-- ============ rechts: cap=True -> Körper ============ -->
  <g>
    <path d="M 580,110 L 540,350 A 110,36 0 0 0 760,350 L 720,110 A 70,24 0 0 1 580,110 Z"
          fill="#f2f4f6" stroke="#333333" stroke-width="2.5"/>
    <path d="M 540,350 A 110,36 0 0 1 760,350" fill="none" stroke="#999999" stroke-width="2" stroke-dasharray="7 6"/>
    <ellipse cx="650" cy="110" rx="70" ry="24" fill="#4a90d9" fill-opacity="0.55" stroke="#1f6fc4" stroke-width="3"/>
    <text x="650" y="70" text-anchor="middle" font-size="25" fill="#777777">geschlossen</text>
  </g>

  <!-- ============ Beschriftung ============ -->
  <text x="250" y="425" text-anchor="middle" font-size="34" font-weight="600" fill="#333333">cap=False  (Standard)</text>
  <text x="250" y="468" text-anchor="middle" font-size="30" fill="#555555">Shell · Solids() → 0</text>

  <text x="650" y="425" text-anchor="middle" font-size="34" font-weight="600" fill="#333333">cap=True</text>
  <text x="650" y="468" text-anchor="middle" font-size="30" fill="#555555">Solid · Solids() → 1</text>

  <line x1="450" y1="40" x2="450" y2="480" stroke="#dddddd" stroke-width="2"/>
</svg>
