<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Inter, 'DejaVu Sans', sans-serif">
  <rect width="980" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ap" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- ================= links: vorher ================= -->
  <g>
    <!-- Platte -->
    <rect x="70" y="120" width="330" height="220" rx="4" fill="#eef1f4" stroke="#333" stroke-width="2.5"/>
    <!-- zentrale Bohrung -->
    <circle cx="235" cy="230" r="34" fill="#ffffff" stroke="#1f6fc4" stroke-width="3.5"/>
    <!-- Zeiger auf den Bohrungsrand -->
    <line x1="360" y1="150" x2="266" y2="212" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ap)"/>
    <text x="330" y="140" fill="#c0392b" font-size="25" font-weight="600">Edges()[13]</text>
    <text x="235" y="392" text-anchor="middle" fill="#1f6fc4" font-size="26" font-weight="600">= CIRCLE</text>
    <text x="235" y="425" text-anchor="middle" fill="#555" font-size="23">der Bohrungsrand</text>
  </g>

  <!-- Pfeil dazwischen -->
  <text x="490" y="215" text-anchor="middle" fill="#333" font-size="22">+ Zuganker-</text>
  <text x="490" y="242" text-anchor="middle" fill="#333" font-size="22">Loch</text>
  <line x1="440" y1="260" x2="540" y2="260" stroke="#888" stroke-width="3.5" marker-end="url(#ap2)"/>
  <defs>
    <marker id="ap2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- ================= rechts: nachher ================= -->
  <g>
    <!-- Platte -->
    <rect x="580" y="120" width="330" height="220" rx="4" fill="#eef1f4" stroke="#333" stroke-width="2.5"/>
    <!-- zentrale Bohrung -->
    <circle cx="745" cy="230" r="34" fill="#ffffff" stroke="#1f6fc4" stroke-width="3.5"/>
    <!-- zusaetzliches Zuganker-Loch -->
    <circle cx="850" cy="160" r="14" fill="#ffffff" stroke="#1f6fc4" stroke-width="3"/>
    <!-- getroffene Randkante rot -->
    <line x1="910" y1="200" x2="910" y2="300" stroke="#c0392b" stroke-width="6"/>
    <!-- Zeiger zeigt jetzt auf eine gerade Kante (Plattenrand) -->
    <line x1="862" y1="150" x2="902" y2="245" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ap)"/>
    <text x="700" y="140" fill="#c0392b" font-size="25" font-weight="600">Edges()[13]</text>
    <text x="745" y="392" text-anchor="middle" fill="#c0392b" font-size="26" font-weight="600">= LINE</text>
    <text x="745" y="425" text-anchor="middle" fill="#555" font-size="23">irgendeine Randkante</text>
  </g>

  <text x="490" y="55" text-anchor="middle" fill="#333" font-size="27" font-weight="600">Derselbe Index — eine andere Kante</text>
</svg>
